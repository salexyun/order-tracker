# Route Order Tracker alerts to the incident responder (incident-response/responder.py),
# which runs on the host at port 8001.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: incident-responder
    receivers:
      - uid: incident-responder-webhook
        type: webhook
        disableResolveMessage: false
        settings:
          url: http://host.docker.internal:8001/alerts
          httpMethod: POST

policies:
  - orgId: 1
    receiver: incident-responder
    group_by: [alertname, http_route]
    group_wait: 5s
    group_interval: 1m
    repeat_interval: 4h
