# Grafana-managed alert: real user impact = server errors on any route.
apiVersion: 1

groups:
  - orgId: 1
    name: order-tracker-user-impact
    folder: Order Tracker
    interval: 10s
    rules:
      - uid: order-tracker-5xx
        title: Order Tracker 5xx responses
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # 5xx count per route over the last 5m. The `unless ... offset` branch counts series
              # that first appeared inside the window, which increase() alone would report as 0.
              expr: |
                sum by (http_route, http_request_method) (
                    (increase(http_server_requests_total{service_name="order-tracker", http_response_status_code=~"5.."}[5m])
                      and http_server_requests_total{service_name="order-tracker", http_response_status_code=~"5.."} offset 5m)
                  or
                    (http_server_requests_total{service_name="order-tracker", http_response_status_code=~"5.."}
                      unless http_server_requests_total{service_name="order-tracker", http_response_status_code=~"5.."} offset 5m)
                )
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        # No 5xx series at all means no server errors: treat as healthy, not as "No data".
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          service: order-tracker
          severity: page
        annotations:
          summary: "Order Tracker returned 5xx on {{ $labels.http_request_method }} {{ $labels.http_route }}"
          description: >-
            {{ printf "%.0f" $values.A.Value }} server error(s) on {{ $labels.http_request_method }} {{ $labels.http_route }}
            in the last 5m.
          endpoint: "{{ $labels.http_request_method }} {{ $labels.http_route }}"
          window: 5m
          dashboard_url: http://localhost:3000/d/order-tracker/order-tracker?from=now-30m&to=now
          __dashboardUid__: order-tracker
          __panelId__: "6"
